<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <title>Perfil - Agenda</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="contactos.html"><i class="fas fa-address-book me-1"></i> Agenda</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="contactos.html">Contactos</a></li>
                <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                <li class="nav-item"><a class="nav-link" href="ToDo-List.html">ToDo List</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-flex align-items-center">
                    <a class="nav-link active fw-bold" href="perfil.html"><i class="fas fa-user me-1 text-muted"></i> Perfil</a>
                </li>
                <li class="nav-item d-flex align-items-center ms-lg-3">
                    <i class="fas fa-sign-out-alt me-1"></i>
                    <a class="nav-link logout-btn" href="../index.html">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="profile-card">
        <div class="profile-image">
            <img src="../image/images.jpg" alt="Foto de perfil">
        </div>
        <div class="profile-info">
            <h2>Usuario Activo</h2>
            <div class="info-item">
                <strong><i class="fas fa-envelope me-2"></i>Correo:</strong>
                <p id="displayEmail">Cargando...</p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const email = localStorage.getItem('userEmail');
        document.getElementById('displayEmail').textContent = email ? email : "No logueado";
    });

    document.querySelector('.logout-btn').addEventListener('click', () => {
        localStorage.clear();
    });
</script>
</body>
</html>
