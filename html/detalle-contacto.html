<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/detalle.css">

</head>
<body class="bg-custom">

<div class="container">
    <div class="card">
        <div class="card-header">
            <i class="fas fa-id-card"></i>
            <h4>Detalles del contacto</h4>
        </div>

        <div class="card-body px-0"> <div class="list-group list-group-flush">
                <div class="list-group-item">
                    <i class="fas fa-user"></i>
                    <div>
                        <strong>Nombre</strong>
                        <div id="nombre" class="fw-bold"></div>
                    </div>
                </div>
                <div class="list-group-item">
                    <i class="fas fa-phone"></i>
                    <div>
                        <strong>Teléfono</strong>
                        <div id="telefono" class="fw-bold"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer text-center">
            <a href="contactos.html" class="btn btn-secondary w-100">
                <i class="fas fa-arrow-left me-1"></i> Volver a la lista
            </a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("nombre").textContent = params.get("nombre");
    document.getElementById("telefono").textContent = params.get("telefono");
</script>

</body>
</html>
