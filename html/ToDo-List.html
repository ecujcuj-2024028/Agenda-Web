<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List - Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/todo.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="contactos.html">
                <i class="fas fa-address-book me-1"></i> Agenda
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="contactos.html">Contactos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="favoritos.html">Favoritos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="ToDo-List.html">
                            <i class="fas fa-list-check me-1"></i> ToDo List
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item d-flex align-items-center">
                        <i class="fas fa-user me-1 text-muted"></i>
                        <a class="nav-link" href="perfil.html">Perfil</a>
                    </li>
                    <li class="nav-item d-flex align-items-center ms-lg-3">
                        <i class="fas fa-sign-out-alt me-1"></i>
                        <a class="nav-link" href="../index.html">Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7">
                <div class="todo-card shadow">
                    <div class="card-header-custom">
                        <h2>Mis Pendientes</h2>
                        <p class="text-muted small mb-0">Organiza tus tareas por prioridad</p>
                    </div>

                    <div class="card-body p-4">
                        <div class="row g-2 mb-4">
                            <div class="col-md-7">
                                <input type="text" id="input-tarea" class="form-control" placeholder="Nueva tarea...">
                            </div>
                            <div class="col-md-3">
                                <select id="inputPrioridad" class="form-select">
                                    <option value="3">Alta</option>
                                    <option value="2">Media</option>
                                    <option value="1">Baja</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button onclick="agregarTarea()" class="btn btn-success w-100">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>

                        <ul id="listaTareas" class="list-group list-group-flush">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/todo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
